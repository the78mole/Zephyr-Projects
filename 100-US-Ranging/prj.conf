CONFIG_LOG=y
CONFIG_GPIO=y
# CONFIG_POWEROFF zieht sleep_cpu.c / sleep_modem.c / rtc_io.c in den Build
# (benoetigt fuer die Linker-Symbole von esp_deep_sleep_start), aktiviert
# aber NICHT den Zephyr-PM-Idle-Hook → kein automatischer Sleep waehrend
# k_sem_take / k_sleep.
CONFIG_POWEROFF=y
