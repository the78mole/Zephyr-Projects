# 200-BThome-Ranging: HC-SR04 + BThome V2 BLE Advertising auf ESP32-S3

# ── Logging ────────────────────────────────────────────────────────────────
CONFIG_LOG=y

# ── GPIO ───────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ── Power (sleep_cpu.c / sleep_modem.c fuer esp_deep_sleep_start) ──────────
# CONFIG_POWEROFF zieht die noetigen HAL-Quellen ein, ohne den PM-Idle-Hook
# zu aktivieren (der wuerde waehrend k_sem_take automatisch deep-sleep ausloesen).
CONFIG_POWEROFF=y

# ── Bluetooth / BThome V2 ──────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ESP32-Ranging"

# Stack-Groessen
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
